stages:
  - lint
  - build
  - test

# --- LINT STAGE ------------------------------------
lint:frontend:
  stage: lint
  image: node:20.19-slim # Matches the preferred version to avoid warnings
  script:
    - cd frontend
    - npm ci
    - npm run lint
  allow_failure: false # Frontend linting is now set up and working!

lint:backend:
  stage: lint
  image: gradle:8.14-jdk21 # pre-installed Gradle avoids download from services.gradle.org
  script:
    - cd backend
    - ./gradlew check -x test --no-daemon # 'check' runs checkstyle automatically
  allow_failure: true # Keeps the pipeline moving even if Java style is slightly off

# BUILD STAGE -------------------------------------------

build:backend:
  stage: build
  image: gradle:8.14-jdk21
  cache:
    key:
      files:
        - backend/build.gradle
    paths:
      - backend/.gradle/
      - ~/.gradle/caches/
      - ~/.gradle/wrapper/
  script:
    - cd backend
    - ./gradlew build -x test --no-daemon
  artifacts:
    paths:
      - backend/build/libs/*.jar
    expire_in: 1 hour

# ─── FRONTEND BUILD ─────────────────────────────────────────────────────────
build:frontend:
  stage: build
  image: node:20-slim
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# ─── BACKEND TESTS ───────────────────────────────────────────────────────────
# JUnit results are published to the MR page automatically (see artifacts.reports.junit).
# Teammates: write test files under backend/src/test/java/ — they are picked up here automatically.
test:backend:
  stage: test
  image: gradle:8.14-jdk21
  needs: [build:backend]
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    # MySQL service config
    MYSQL_DATABASE: testdb
    MYSQL_ROOT_PASSWORD: testpass
    # Override Spring Boot datasource to point at the CI MySQL service
    SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/testdb?allowPublicKeyRetrieval=true&useSSL=false"
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: testpass
    SPRING_JPA_HIBERNATE_DDL_AUTO: update
  cache:
    key:
      files:
        - backend/build.gradle
    paths:
      - backend/.gradle/
      - ~/.gradle/caches/
      - ~/.gradle/wrapper/
  before_script:
    - apt-get update -qq && apt-get install -y -qq default-mysql-client
    - |
      echo "Waiting for MySQL to be ready..."
      until mysqladmin ping -h mysql -u root -ptestpass --silent 2>/dev/null; do
        echo "  MySQL not ready yet, retrying in 2s..."
        sleep 2
      done
      echo "MySQL is ready."
  script:
    - cd backend
    - ./gradlew test --no-daemon
  artifacts:
    when: always # Upload report even if tests fail so you can see what broke
    reports:
      junit: backend/build/test-results/**/*.xml
    paths:
      - backend/build/reports/tests/
    expire_in: 1 week

# ─── FRONTEND TESTS ──────────────────────────────────────────────────────────
test:frontend:
  stage: test
  image: node:20-slim
  needs: [build:frontend]
  allow_failure: false
  script:
    - cd frontend
    - npm ci
    - npm run test

