spring.config.import=optional:dotenv:

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flight_tracker_db}
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# FlightAware AeroAPI Configuration
aeroapi.key=${AEROAPI_KEY:default-key-not-set}

# Live position background sync interval in milliseconds (default: 5 minutes)
sync.interval.ms=300000
# Reduce log noise (Tomcat/DispatcherServlet startup messages)
logging.level.org.apache.catalina=WARN
logging.level.org.springframework.web.servlet=WARN
logging.level.org.springframework.boot.web.servlet=WARN
